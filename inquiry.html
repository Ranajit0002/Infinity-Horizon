<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Inquiry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="shortcut icon"
      href="assets/images/logo.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body
    class="bg-gray-50 font-sans antialiased h-screen flex flex-col lg:flex-row overflow-hidden relative"
  >
    <header
      class="bg-[#161a2b] p-4 flex items-center justify-between lg:hidden shadow-md z-40 shrink-0"
    >
      <button
        id="menu-toggle"
        class="text-2xl focus:outline-none text-white hover:text-[#DAA520] transition-colors"
      >
        <i class="fas fa-bars"></i>
      </button>
      <a href="index.html">
        <img
          src="assets/images/logo.png"
          alt="Infinity Horizon Logo"
          class="h-8 object-contain"
        />
      </a>
    </header>

    <aside
      id="sidebar"
      class="bg-[#161a2b] text-gray-300 w-64 h-full fixed inset-y-0 left-0 lg:relative lg:translate-x-0 -translate-x-full z-50 flex flex-col p-6 shadow-xl shrink-0"
    >
      <div class="flex items-center justify-between mb-10">
        <div class="flex items-center w-full justify-center">
          <a href="index.html" class="w-[74px] h-[92px]">
            <img
              src="assets/images/logo.png"
              alt="Infinity Horizon Logo"
              class="object-cover"
          /></a>
        </div>
        <button
          id="menu-close"
          class="text-2xl lg:hidden focus:outline-none text-gray-400 hover:text-white absolute right-4 top-6"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>

      <nav class="flex-1 space-y-2 overflow-y-auto hide-scrollbar">
        <a
          href="dashboard.html"
          class="flex items-center gap-3.5 px-4 py-3.5 rounded-xl hover:bg-white/10 hover:text-white transition-colors"
        >
          <i class="fas fa-th-large text-lg w-5 text-center"></i>
          <span class="font-medium text-sm">Dashboard</span>
        </a>

        <a
          href="inquiry.html"
          class="flex items-center gap-3.5 px-4 py-3.5 rounded-xl bg-white text-[#161a2b] shadow-sm transition-colors font-bold"
        >
          <i class="fas fa-headset text-lg w-5 text-center"></i>
          <span class="text-sm">Customer Inquiry</span>
        </a>

        <a
          href="manage-properties.html"
          class="flex items-center gap-3.5 px-4 py-3.5 rounded-xl hover:bg-white/10 hover:text-white transition-colors"
        >
          <i class="fas fa-building text-lg w-5 text-center"></i>
          <span class="font-medium text-sm">Manage Properties</span>
        </a>

        <a
          href="chats.html"
          class="flex items-center gap-3.5 px-4 py-3.5 rounded-xl hover:bg-white/10 hover:text-white transition-colors"
        >
          <i class="fas fa-comments text-lg w-5 text-center"></i>
          <span class="font-medium text-sm">Chats</span>
        </a>
      </nav>

      <div class="mt-6 space-y-4">
        <div class="bg-white p-4 rounded-xl flex items-center gap-3 shadow-md">
          <img
            src="assets/images/agent-1.jpg"
            alt="Sneha Paul"
            class="w-12 h-12 rounded-xl object-cover"
          />
          <div class="overflow-hidden">
            <p class="font-bold text-[#161a2b] text-sm truncate">Sneha Paul</p>
            <p class="text-xs text-[#161a2b] font-medium opacity-80 truncate">
              Agent
            </p>
          </div>
        </div>
        <button
          class="w-full flex items-center justify-center gap-2 bg-white/10 text-gray-300 py-3 rounded-xl hover:bg-white/20 hover:text-white transition-colors font-medium text-sm"
        >
          <i class="fas fa-sign-out-alt"></i>
          Logout
        </button>
      </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto bg-[#f4f7f6] relative w-full">
      <div
        class="mx-auto max-w-[1320px] flex flex-col p-4 md:p-6 lg:p-8 min-h-full"
      >
        <header
          class="sticky top-0 z-30 bg-[#f4f7f6] py-2 mb-6 flex items-center justify-between gap-4"
        >
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <h1
              class="text-xl md:text-2xl lg:text-3xl font-extrabold text-[#161a2b] truncate"
            >
              Customer Inquiry
            </h1>
          </div>

          <div
            class="flex items-center gap-2 md:gap-4 bg-white/50 backdrop-blur-sm p-1.5 rounded-full shadow-sm shrink-0"
          >
            <button
              class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-full bg-gray-200 text-gray-600 hover:bg-gray-300 transition"
            >
              <i class="fas fa-search"></i>
            </button>

            <button
              class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-full bg-gray-200 text-gray-600 hover:bg-gray-300 transition relative"
            >
              <i class="fas fa-bell"></i>
            </button>
            <img
              src="assets/images/agent-1.jpg"
              alt="User Profile"
              class="w-9 h-9 md:w-10 md:h-10 rounded-full object-cover border border-gray-200 cursor-pointer ml-1"
            />
          </div>
        </header>

        <h2 class="text-xl font-bold text-[#161a2b] mb-4 shrink-0">
          List view
        </h2>

        <div
          class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6 flex flex-col relative z-10 mb-6"
        >
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-gray-800 text-lg">Customer List</h3>
          </div>

          <div class="overflow-x-auto w-full relative hide-scrollbar">
            <table
              class="w-full text-sm text-left whitespace-nowrap min-w-[950px]"
            >
              <thead class="text-white bg-[#161a2b]">
                <tr>
                  <th class="px-5 py-3.5 font-medium">ID</th>
                  <th class="px-5 py-3.5 font-medium">Client Name</th>
                  <th class="px-5 py-3.5 font-medium">Client Email</th>
                  <th class="px-5 py-3.5 font-medium">Customer Message</th>
                  <th class="px-5 py-3.5 font-medium">Property Name</th>
                  <th class="px-5 py-3.5 font-medium text-center">Action</th>
                </tr>
              </thead>
              <tbody id="table-body" class="text-gray-600 relative z-0"></tbody>
            </table>
          </div>

          <div
            class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-gray-600 border-t border-gray-100 pt-4"
          >
            <div id="pagination-info">Showing 1-16 out of 32 result</div>
            <div class="flex items-center gap-2" id="pagination-controls"></div>
          </div>
        </div>
      </div>
    </main>

    <div
      id="mobile-overlay"
      class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"
    ></div>

    <div
      id="toast"
      class="fixed bottom-8 left-1/2 -translate-x-1/2 lg:left-auto lg:right-8 lg:translate-x-0 z-50 flex items-center p-4 space-x-3 w-max max-w-xs text-gray-500 bg-white rounded-lg shadow-lg border-l-4 toast-exit transition-all duration-300 ease-in-out pointer-events-none"
      role="alert"
    >
      <div
        id="toast-icon"
        class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
      >
        <i class="fas fa-check"></i>
      </div>
      <div id="toast-message" class="ml-3 text-sm font-semibold text-gray-800">
        Action Successful
      </div>
    </div>

    <script>
      const sidebar = document.getElementById("sidebar");
      const menuToggle = document.getElementById("menu-toggle");
      const menuClose = document.getElementById("menu-close");
      const overlay = document.getElementById("mobile-overlay");

      function toggleSidebar() {
        sidebar.classList.toggle("-translate-x-full");
        overlay.classList.toggle("hidden");
      }

      menuToggle.addEventListener("click", toggleSidebar);
      menuClose.addEventListener("click", toggleSidebar);
      overlay.addEventListener("click", toggleSidebar);

      const customersData = Array.from({ length: 32 }, (_, i) => ({
        id: `CUS ${2001 + i}`,
        img: `https://randomuser.me/api/portraits/${i % 2 === 0 ? "men" : "women"}/${30 + (i % 20)}.jpg`,
        clientName: `Client Name ${i + 1}`,
        clientEmail: `client${i + 1}@gmail.com`,
        customerMessage: `Hello, I want to know more details about this property (ID: ${2001 + i}). Could you arrange a site visit this weekend? Thanks.`,
        propertyName: [
          "Sunset Villa",
          "Downtown Office Space",
          "Lakeview Apartment",
          "Commercial Hub",
        ][i % 4],
        status: "Pending",
      }));

      let currentPage = 1;
      const itemsPerPage = 16;

      let openDropdownIndex = null;

      function getStatusBtnClass(status) {
        if (status === "Approved")
          return "bg-green-50 text-green-700 border-green-200 hover:bg-green-100 shadow-[0_0_10px_rgba(34,197,94,0.1)]";
        if (status === "Disapproved")
          return "bg-orange-50 text-orange-700 border-orange-200 hover:bg-orange-100 shadow-[0_0_10px_rgba(249,115,22,0.1)]";
        return "bg-white border-gray-200 text-gray-700 hover:bg-gray-50";
      }

      document.addEventListener("click", function (event) {
        const isDropdownClick = event.target.closest(".custom-dropdown");
        if (!isDropdownClick && openDropdownIndex !== null) {
          closeDropdown(openDropdownIndex);
          openDropdownIndex = null;
        }
      });

      function closeDropdown(index) {
        const menu = document.getElementById(`dropdown-menu-${index}`);
        const arrow = document.getElementById(`dropdown-arrow-${index}`);
        if (menu && arrow) {
          menu.classList.remove("dropdown-visible");
          menu.classList.add("dropdown-hidden");
          arrow.classList.remove("rotate-180");
        }
      }

      window.toggleDropdown = function (event, index) {
        event.stopPropagation();

        if (openDropdownIndex !== null && openDropdownIndex !== index) {
          closeDropdown(openDropdownIndex);
        }

        const menu = document.getElementById(`dropdown-menu-${index}`);
        const arrow = document.getElementById(`dropdown-arrow-${index}`);

        if (menu.classList.contains("dropdown-hidden")) {
          menu.classList.remove("dropdown-hidden");
          menu.classList.add("dropdown-visible");
          arrow.classList.add("rotate-180");
          openDropdownIndex = index;
        } else {
          closeDropdown(index);
          openDropdownIndex = null;
        }
      };

      window.selectAction = function (event, index, action) {
        event.preventDefault();
        event.stopPropagation();

        closeDropdown(index);
        openDropdownIndex = null;

        const customer = customersData[index];
        customer.status = action;

        renderTable();
        showToast(
          `Status updated to ${action} for ${customer.clientName}`,
          action,
        );
      };

      function renderTable() {
        const tableBody = document.getElementById("table-body");
        tableBody.innerHTML = "";

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const currentItems = customersData.slice(startIndex, endIndex);

        currentItems.forEach((item, index) => {
          if (item.status === "Deleted") return;

          const actualIndex = startIndex + index;
          const tr = document.createElement("tr");
          tr.className =
            "hover:bg-gray-50/50 transition border-b border-gray-50 last:border-0 relative";

          const isTopHalf = index < 10;

          const tooltipPosClass = isTopHalf
            ? "top-full mt-2"
            : "bottom-full mb-2";
          const arrowPosClass = isTopHalf
            ? "bottom-full border-b-gray-800 border-x-transparent border-t-transparent"
            : "top-full border-t-gray-800 border-x-transparent border-b-transparent";

          const dropdownPosClass = isTopHalf
            ? "top-full mt-1.5 origin-top-right"
            : "bottom-full mb-1.5 origin-bottom-right";

          tr.innerHTML = `
                    <td class="px-5 py-4 font-medium text-gray-700">${item.id}</td>
                    <td class="px-5 py-4 flex items-center gap-3">
                        <img src="${item.img}" alt="${item.clientName}" class="w-8 h-8 rounded-full object-cover">
                        <span class="font-medium text-gray-800">${item.clientName}</span>
                    </td>
                    <td class="px-5 py-4 text-gray-600">${item.clientEmail}</td>
                    
                    <td class="px-5 py-4 relative group cursor-help">
                        <div class="truncate max-w-[180px] text-gray-500">${item.customerMessage}</div>
                        <div class="absolute ${tooltipPosClass} left-1/2 -translate-x-1/2 hidden group-hover:block w-64 bg-gray-800 text-white text-xs rounded-lg p-3 shadow-xl z-50 whitespace-normal leading-relaxed pointer-events-none">
                            ${item.customerMessage}
                            <div class="absolute left-1/2 -translate-x-1/2 border-[6px] ${arrowPosClass}"></div>
                        </div>
                    </td>

                    <td class="px-5 py-4 text-gray-800 font-medium">${item.propertyName}</td>
                    
                    <td class="px-5 py-3 w-40 text-center">
                        <div class="relative inline-block text-left w-full custom-dropdown">
                            
                            <button type="button" onclick="toggleDropdown(event, ${actualIndex})" class="inline-flex justify-between items-center w-full rounded-lg border px-3 py-2 text-xs font-bold transition-all focus:outline-none focus:ring-2 focus:ring-[#161a2b]/20 ${getStatusBtnClass(item.status)}">
                                <span>${item.status}</span>
                                <i id="dropdown-arrow-${actualIndex}" class="fas fa-chevron-down text-[10px] ml-2 transition-transform duration-300"></i>
                            </button>
                            
                            <div id="dropdown-menu-${actualIndex}" class="dropdown-hidden absolute right-0 z-50 ${dropdownPosClass} w-[140px] rounded-xl bg-white shadow-xl ring-1 ring-black/5 focus:outline-none overflow-hidden">
                                <div class="py-1 flex flex-col p-1 gap-0.5">
                                    <a href="#" onclick="selectAction(event, ${actualIndex}, 'Pending')" class="flex items-center gap-2 px-3 py-2 text-xs font-semibold text-gray-600 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition">
                                        <i class="fas fa-circle text-[8px] text-gray-400"></i> Pending
                                    </a>
                                    <a href="#" onclick="selectAction(event, ${actualIndex}, 'Approved')" class="flex items-center gap-2 px-3 py-2 text-xs font-semibold text-green-700 rounded-lg hover:bg-green-50 transition">
                                        <i class="fas fa-check-circle text-[10px] text-green-500"></i> Approve
                                    </a>
                                    <a href="#" onclick="selectAction(event, ${actualIndex}, 'Disapproved')" class="flex items-center gap-2 px-3 py-2 text-xs font-semibold text-orange-700 rounded-lg hover:bg-orange-50 transition">
                                        <i class="fas fa-times-circle text-[10px] text-orange-500"></i> Disapprove
                                    </a>
                                    <div class="h-px bg-gray-100 my-1"></div>
                                    <a href="#" onclick="selectAction(event, ${actualIndex}, 'Deleted')" class="flex items-center gap-2 px-3 py-2 text-xs font-semibold text-red-600 rounded-lg hover:bg-red-50 transition">
                                        <i class="fas fa-trash-alt text-[10px] text-red-500"></i> Delete
                                    </a>
                                </div>
                            </div>

                        </div>
                    </td>
                `;
          tableBody.appendChild(tr);
        });

        updatePaginationInfo();
        renderPaginationControls();
      }

      function updatePaginationInfo() {
        const total = customersData.filter(
          (c) => c.status !== "Deleted",
        ).length;
        const startIndex =
          total === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
        const endIndex = Math.min(currentPage * itemsPerPage, total);
        document.getElementById("pagination-info").innerText =
          `Showing ${startIndex}-${endIndex} out of ${total} result`;
      }

      function renderPaginationControls() {
        const total = customersData.filter(
          (c) => c.status !== "Deleted",
        ).length;
        const totalPages = Math.ceil(total / itemsPerPage);
        const controls = document.getElementById("pagination-controls");
        controls.innerHTML = "";
        if (totalPages <= 1) return;

        controls.innerHTML += `<button onclick="changePage(${currentPage - 1})" class="px-3 py-1.5 font-medium transition ${currentPage === 1 ? "text-gray-400 cursor-not-allowed" : "hover:text-[#161a2b]"}" ${currentPage === 1 ? "disabled" : ""}>Prev.</button>`;
        for (let i = 1; i <= totalPages; i++) {
          if (i === currentPage) {
            controls.innerHTML += `<button class="w-8 h-8 flex items-center justify-center rounded-full bg-[#161a2b] text-white font-medium">${i}</button>`;
          } else {
            controls.innerHTML += `<button onclick="changePage(${i})" class="w-8 h-8 flex items-center justify-center rounded-full border border-gray-300 hover:border-gray-400 font-medium transition">${i}</button>`;
          }
        }
        controls.innerHTML += `<button onclick="changePage(${currentPage + 1})" class="px-3 py-1.5 font-medium transition ${currentPage === totalPages ? "text-gray-400 cursor-not-allowed" : "hover:text-[#161a2b]"}" ${currentPage === totalPages ? "disabled" : ""}>Next</button>`;
      }

      function changePage(page) {
        const total = customersData.filter(
          (c) => c.status !== "Deleted",
        ).length;
        const totalPages = Math.ceil(total / itemsPerPage);
        if (page >= 1 && page <= totalPages) {
          currentPage = page;
          openDropdownIndex = null;
          renderTable();
        }
      }

      let toastTimeout;
      function showToast(message, type) {
        const toast = document.getElementById("toast");
        const toastMsg = document.getElementById("toast-message");
        const toastIcon = document.getElementById("toast-icon");

        toast.className =
          "fixed bottom-8 left-1/2 -translate-x-1/2 lg:left-auto lg:right-8 lg:translate-x-0 z-50 flex items-center p-4 space-x-3 w-max max-w-xs bg-white rounded-xl shadow-2xl border-l-4 transition-all duration-300 ease-in-out";
        toastIcon.className =
          "inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg text-white shadow-sm";
        toastMsg.innerText = message;

        if (type === "Approved") {
          toast.classList.add("border-green-500");
          toastIcon.classList.add("bg-green-500");
          toastIcon.innerHTML = '<i class="fas fa-check"></i>';
        } else if (type === "Disapproved") {
          toast.classList.add("border-orange-500");
          toastIcon.classList.add("bg-orange-500");
          toastIcon.innerHTML = '<i class="fas fa-times"></i>';
        } else if (type === "Deleted") {
          toast.classList.add("border-red-500");
          toastIcon.classList.add("bg-red-500");
          toastIcon.innerHTML = '<i class="fas fa-trash"></i>';
        }

        toast.classList.remove("toast-exit", "pointer-events-none");
        toast.classList.add("toast-enter");

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove("toast-enter");
          toast.classList.add("toast-exit", "pointer-events-none");
        }, 3000);
      }

      renderTable();
    </script>
  </body>
</html>
