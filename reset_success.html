<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Successfully Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="shortcut icon"
      href="assests/images/login_Signup/logo.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="assests/css/cmn-style.css" />
  </head>
  <body class="bg-gray-50">
    <div
      class="relative min-h-screen flex items-center justify-center bg-cover bg-center p-4 sm:p-8"
      style="
        background-image: url(assests/images/login_Signup//password-reset-success.png);
      "
    >
      <div
        class="absolute top-8 left-1/2 -translate-x-1/2 lg:translate-x-0 lg:left-12 flex flex-col items-center gap-2 z-20"
      >
        <a href="index.html" class="w-[74px] h-[92px]">
          <img
            src="assests/images/login_Signup/logo.png"
            alt="logo"
            loading="lazy"
          />
        </a>
      </div>
      <div
        class="relative z-10 w-full max-w-lg p-8 sm:p-12 flex flex-col items-center text-center"
      >
        <div
          class="w-16 h-16 bg-[#111827] rounded-2xl flex items-center justify-center mb-6 shadow-md"
        >
          <i class="fa-solid fa-circle-check text-white text-3xl"></i>
        </div>
        <h1
          class="text-3xl sm:text-[2.5rem] leading-tight font-bold text-gray-900 mb-4"
        >
          Password reset success
        </h1>

        <p class="text-gray-800 text-sm leading-relaxed mb-10 px-2 sm:px-6">
          Your credentials have been updated securely. You can now use your new
          password to access your Infinity Horizon portfolio.
        </p>
        <a
          href="login.html"
          class="w-full bg-[#111827] text-white rounded-md py-3.5 text-base font-medium transition-all duration-300 hover:bg-[#FCA311] hover:shadow-lg active:scale-[0.98] block"
        >
          Back to Login
        </a>
        <div class="mt-6">
          <p class="text-[13px] text-gray-700">
            Having trouble?
            <a
              href="#"
              class="font-semibold text-gray-900 hover:text-[#FCA311] transition-colors"
              >Contact support</a
            >
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
