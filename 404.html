<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <link
      rel="shortcut icon"
      href="assests/images/login_Signup/logo.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="assests/css/cmn-style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body
    class="bg-white text-gray-900 antialiased min-h-screen relative flex flex-col overflow-x-hidden"
  >
    <div class="max-w-[1320px] mx-auto">
      <div
        class="absolute bottom-0 left-0 w-full h-full bg-cover bg-bottom bg-no-repeat"
        style="background-image: url(assests/images/login_Signup//404bg.png)"
      ></div>
      <div
        class="relative z-10 flex-1 flex flex-col items-center w-full max-w-2xl mx-auto px-6 py-2 text-center mt-8"
      >
        <div class="flex flex-col items-center gap-2 mb-8">
          <a href="index.html" class="w-[74px] h-[92px]">
            <img
              src="assests/images/login_Signup//logo.png"
              alt="logo"
              loading="lazy"
            />
          </a>
        </div>
        <div
          class="flex items-center justify-center mb-6 font-404 gap-2 md:gap-3 sm:gap-4"
        >
          <span
            class="text-[#111827] text-[5rem] sm:text-[10rem] font-black leading-none tracking-tighter"
          >
            4
          </span>
          <div
            class="relative flex items-center justify-center w-[5rem] h-[5rem] sm:w-[7rem] sm:h-[7rem] md:w-[9rem] md:h-[9rem] lg:w-[11rem] lg:h-[11rem] rounded-full shadow-[0_0_80px_rgba(0,0,0,0.06)] bg-white gap-2"
          >
            <div
              class="absolute inset-0 rounded-full border-[3px] sm:border-[4px] md:border-[6px] border-[#E2E8F0] opacity-70"
            ></div>
            <div
              class="absolute inset-[16%] rounded-full border-[10px] sm:border-[16px] md:border-[22px] lg:border-[28px] border-[#CBD5E1] opacity-60"
            ></div>
          </div>
          <span
            class="text-[#111827] text-[5rem] sm:text-[10rem] font-black leading-none tracking-tighter"
          >
            4
          </span>
        </div>
        <h1 class="text-3xl sm:text-[2.5rem] font-bold text-gray-900 mb-3">
          Look like you're lost
        </h1>
        <p class="text-gray-500 text-sm mb-10">
          The page you're looking for is not available!
        </p>
        <div class="w-full max-w-[320px] mx-auto mb-6">
          <a
            href="index.html"
            class="block w-full bg-[#111827] text-white rounded-md py-3.5 text-base font-medium transition-all duration-300 hover:bg-[#FCA311] hover:shadow-md active:scale-[0.98]"
          >
            Go to Home
          </a>
        </div>
        <div>
          <p class="text-[13px] text-gray-600">
            Having trouble?
            <a
              href="#"
              class="font-medium text-gray-900 hover:text-[#FCA311] transition-colors"
              >Contact support</a
            >
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
